<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Butaca</title>
<meta name="description" content="Calificá una película en cinco preguntas y obtené una nota de 0,5 a 5 estrellas con la reseña escrita.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23E8B33D' d='M16 2l4.1 8.9 9.7 1.1-7.2 6.6 2 9.6L16 23.3 7.4 28.2l2-9.6L2.2 12l9.7-1.1z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
/* Butaca usa la paleta, las tipografías y los componentes compartidos del sitio
   (../css/style.css: .topnav, .btn, .eyebrow, .site-footer). Acá solo van los
   componentes propios de la herramienta: progreso, opciones, talón. */
:root{
  --bt-line:rgba(242,232,213,.16);    /* divisores y bordes decorativos */
  --bt-control:rgba(242,232,213,.4);  /* bordes de controles: ~3,3:1 contra --ink (WCAG 1.4.11) */
  color-scheme:dark;
}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  scroll-behavior:auto} /* el sitio usa smooth; acá cada paso vuelve arriba de golpe, como el contenido que acaba de cambiar */
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;color:var(--parchment)}
h2{font-size:clamp(1.8rem,4vw,2.3rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment-dim)}

/* Layout: columna angosta y alineada a la izquierda dentro del mismo .wrap que usan el nav y el footer */
.bt-main{padding:64px 0 88px}
.bt-col{max-width:720px;display:flex;flex-direction:column;gap:28px}

/* Encabezado */
.bt-masthead{padding-bottom:28px;border-bottom:1px solid var(--bt-line)}
.bt-masthead h1{font-size:clamp(3.2rem,11vw,5.2rem);font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
.bt-masthead p{color:var(--parchment-dim);max-width:44ch;text-wrap:pretty}

/* Progreso: cinco tramos rectos; hecho en crema, actual en teal, pendiente apagado */
.reel{display:flex;flex-direction:column;gap:10px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.strip span{height:4px;background:rgba(242,232,213,.14)}
.strip span.on{background:var(--parchment-dim)}
.strip span.cur{background:var(--brass)}

/* Etapas */
.stage{display:flex;flex-direction:column;gap:24px}
.lede{color:var(--parchment-dim);max-width:60ch;margin-top:10px;text-wrap:pretty}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:600;color:var(--parchment);margin-bottom:10px;padding:0}
legend small,.opt-note{font-weight:400;color:var(--parchment-dim);font-size:.88rem}
.fields{display:grid;grid-template-columns:1fr 110px;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--parchment);min-width:0}
.field input,.field textarea,.why,.actor input{width:100%;background:var(--ink-2);border:1px solid var(--bt-control);border-radius:2px;padding:12px 14px;font-weight:400;color:var(--parchment)}
.field textarea{min-height:84px;resize:vertical}
.field input::placeholder,.field textarea::placeholder,.why::placeholder,.actor input::placeholder{color:var(--parchment-dim);opacity:.75}
.field input:focus,.field textarea:focus,.why:focus,.actor input:focus{border-color:var(--brass)}

/* Opciones: la selección se invierte (crema), la acción principal queda en teal */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--bt-control);background:transparent;border-radius:2px;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--parchment);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:border-color .15s,background .15s,color .15s}
.opt small{font-weight:400;color:var(--parchment-dim);font-size:.82rem}
.opt:hover{border-color:var(--parchment)}
.opt[aria-pressed="true"]{background:var(--parchment);color:var(--ink);border-color:var(--parchment)}
.opt[aria-pressed="true"] small{color:inherit;opacity:.75}
.opt.skip{font-weight:400;color:var(--parchment-dim);border-style:dashed}
.opt.skip[aria-pressed="true"]{background:var(--ink-3);color:var(--parchment);border-color:var(--parchment-dim)}
.chip{border-radius:999px;padding:7px 14px;font-weight:500}

.gut{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gut .opt{align-items:center;text-align:center;padding:14px 8px;gap:6px}
.gut .opt b{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1}
@media (max-width:520px){.gut{grid-template-columns:1fr}.gut .opt{flex-direction:row;justify-content:flex-start;gap:12px;text-align:left}.gut .opt b{width:1.4em;text-align:center}}

.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--brass)}
.range-row output{font-family:var(--mono);min-width:3.5em;text-align:right}

.area{border-top:1px solid var(--bt-line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.area:first-of-type{border-top:0;padding-top:0}
.area-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.area-head span{color:var(--parchment-dim);font-size:.9rem}
.actors{display:flex;flex-direction:column;gap:10px;background:var(--ink-2);border:1px solid var(--bt-line);border-radius:2px;padding:14px}
.actor{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1.4fr) auto;gap:8px;align-items:center}
.actor .opts{flex-wrap:nowrap;gap:4px}
.actor .opt{padding:8px 10px;font-size:.88rem}
.x{border:0;background:none;color:var(--parchment-dim);cursor:pointer;font-size:1.3rem;padding:4px 8px;border-radius:2px}
.x:hover{color:var(--frost)}
@media (max-width:600px){.actor{grid-template-columns:1fr auto}.actor .why-a{grid-column:1/-1}.actor .opts{grid-column:1;grid-row:2}.actor .x{grid-column:2;grid-row:1}}
.link{border:0;background:none;color:var(--brass);font-weight:600;cursor:pointer;padding:4px 0;align-self:flex-start}
.link:hover{color:var(--frost)}

.navbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--bt-line);padding-top:20px}
.hint{color:var(--parchment-dim);font-size:.88rem}

/* Botones: base compartida (.btn de style.css, contorno teal); acá el relleno de la acción principal y el estado deshabilitado */
.btn{background:transparent;cursor:pointer}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.primary:hover{background:var(--frost);border-color:var(--frost);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--brass)}
.btn.primary:disabled:hover{background:var(--brass);border-color:var(--brass);color:var(--ink)}

/* Talón de entrada */
.ticket{background:var(--ink-2);display:grid;grid-template-columns:minmax(0,1fr) 190px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(242,232,213,.22);
  -webkit-mask:radial-gradient(circle at calc(100% - 190px) 0,transparent 11px,#000 11.5px) top/100% 51% no-repeat,radial-gradient(circle at calc(100% - 190px) 100%,transparent 11px,#000 11.5px) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle at calc(100% - 190px) 0,transparent 11px,#000 11.5px) top/100% 51% no-repeat,radial-gradient(circle at calc(100% - 190px) 100%,transparent 11px,#000 11.5px) bottom/100% 51% no-repeat}
.ticket .main{padding:24px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ticket .stub{padding:24px 18px;border-left:2px dashed var(--bt-control);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ticket .title{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,5vw,2.5rem);line-height:1.02;overflow-wrap:anywhere;color:var(--parchment)}
.big-num{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:.9;color:var(--epic)}
.adj{display:flex;align-items:center;gap:6px}
.adj button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bt-control);background:transparent;font-weight:600;font-size:1.1rem;cursor:pointer;color:var(--parchment)}
.adj button:hover:not(:disabled){border-color:var(--parchment)}
.adj button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:560px){.ticket{grid-template-columns:1fr;-webkit-mask:none;mask:none}.ticket .stub{border-left:0;border-top:2px dashed var(--bt-control)}}

.stars{position:relative;display:inline-block;white-space:nowrap;line-height:1;font-size:1.6rem}
.stars .bg{color:rgba(242,232,213,.2)}
.stars .fg{position:absolute;left:0;top:0;bottom:0;overflow:hidden;color:var(--epic)}
.stars.lg{font-size:2rem}

.breakdown{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,14rem) 1fr 3rem;gap:12px;align-items:center;font-size:.92rem}
.bar{height:8px;background:rgba(242,232,213,.14)}
.bar i{display:block;height:100%;background:var(--brass)}
.bar-row .v{font-family:var(--mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--parchment-dim)}
@media (max-width:480px){.bar-row{grid-template-columns:1fr 3rem}.bar-row .bar{grid-column:1/-1;grid-row:2}}

.review textarea{min-height:260px;line-height:1.6;font-size:1rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>

<header class="topnav">
  <div class="wrap">
    <a class="mark" href="../index.html">tato<span>.</span></a>
  </div>
</header>

<main class="bt-main">
  <div class="wrap">
    <div class="bt-col">
      <section class="bt-masthead">
        <p class="eyebrow">Herramienta · Reseñas de cine</p>
        <h1>Butaca</h1>
        <p>Cinco preguntas, una nota de media en media estrella y la reseña escrita.</p>
      </section>

      <div class="reel" id="reel"></div>
      <section class="stage" id="stage" aria-live="polite"></section>
      <div class="navbar" id="navbar"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="mark">tato.</p>
    <p class="rights">Nada de lo que escribís sale de tu navegador.</p>
  </div>
</footer>

<script>
/* ---------- Datos fijos ---------- */
const AREAS = [
  {k:'guion', name:'Guion', hint:'Historia, diálogos, cómo cierra', art:'el guion', pl:false},
  {k:'actuaciones', name:'Actuaciones', hint:'Todo el elenco, no solo los protagonistas', art:'las actuaciones', pl:true},
  {k:'direccion', name:'Dirección y fotografía', hint:'Cómo está filmada, lo visual', art:'la dirección y la fotografía', pl:true},
  {k:'sonido', name:'Música y sonido', hint:'Banda sonora y diseño de sonido', art:'la música y el sonido', pl:true},
  {k:'ritmo', name:'Ritmo y montaje', hint:'¿Fluye o se hizo larga?', art:'el ritmo', pl:false},
];
const LEVELS = [{l:'Floja',v:0},{l:'Correcta',v:.4},{l:'Buena',v:.75},{l:'Sobresaliente',v:1}];
const GUT = [
  {l:'La odié',v:0,b:'1'},{l:'No me gustó',v:.2,b:'2'},{l:'Ni fu ni fa',v:.5,b:'3'},
  {l:'Me gustó',v:.75,b:'4'},{l:'Me voló la cabeza',v:1,b:'5'}];
const FEELS = ['Me hizo reír','Me emocionó','Me tensionó','Me hizo pensar','Me dio miedo','Me quedé pensándola','Me aburrió','Me incomodó','Me enojó','Me costó seguirla','No sé si la entendí','Nada especial'];
const FUL = [{l:'Se quedó corta',v:0},{l:'A medias',v:.4},{l:'Sí, cumple',v:.75},{l:'La superó',v:1}];
const RW = [{l:'Nunca',v:0},{l:'Quizás',v:.4},{l:'Sí',v:.75},{l:'Ya mismo',v:1}];
const DONE = [
  {k:'yes',l:'Sí, entera'},
  {k:'partial',l:'La vi a medias',s:'En partes o con distracciones'},
  {k:'quit',l:'La abandoné'}];
const W = {gut:.55, areas:.30, tail:.15};
const STAR_LABEL = {0.5:'Horrible',1:'Muy mala',1.5:'Mala',2:'Floja',2.5:'Regular',3:'Buena',3.5:'Muy buena',4:'Excelente',4.5:'Casi perfecta',5:'Obra maestra'};
const STEPS = ['La película','Primera impresión','Por áreas','Lo mejor y lo peor','Cierre'];

/* ---------- Estado ---------- */
function fresh(){
  const areas = {}; AREAS.forEach(a => areas[a.k] = {lv:null, why:''});
  return {title:'', year:'', done:'yes', quitAt:50, gut:null, feels:[], areas,
          actors:[], best:'', worst:'', fulfilled:null, rewatch:null, recommend:''};
}
const S = {step:0, f:fresh(), adjust:0, seed:0, review:'', reviewEdited:false};

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => (v % 1 ? v.toFixed(1).replace('.', ',') : String(v));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const tidy = s => String(s || '').trim().replace(/[.\s]+$/, '');
const lc = s => { s = tidy(s); return s ? s[0].toLowerCase() + s.slice(1) : ''; };
const cap = s => { s = String(s || '').trim(); return s ? s[0].toUpperCase() + s.slice(1) : ''; };
function joinY(arr){
  if (arr.length <= 1) return arr[0] || '';
  const last = arr[arr.length - 1];
  const y = /^h?i(?![aeou])/i.test(last) ? 'e' : 'y';
  return arr.slice(0, -1).join(', ') + ' ' + y + ' ' + last;
}
function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function starsHTML(v, cls=''){
  return `<span class="stars ${cls}" role="img" aria-label="${fmt(v)} de 5 estrellas"><span class="bg" aria-hidden="true">★★★★★</span><span class="fg" aria-hidden="true" style="width:${v/5*100}%">★★★★★</span></span>`;
}
function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  ks.slice(0, -1).forEach(k => o = o[k]);
  o[ks[ks.length - 1]] = val;
}

/* ---------- Puntaje ---------- */
function score(f){
  const gut = f.gut == null ? 0 : GUT[f.gut].v;
  const rated = AREAS.map(a => f.areas[a.k].lv).filter(v => typeof v === 'number');
  const areas = rated.length ? rated.reduce((s, v) => s + LEVELS[v].v, 0) / rated.length : gut;
  const ful = f.fulfilled == null ? .5 : FUL[f.fulfilled].v;
  const rw = f.rewatch == null ? .5 : RW[f.rewatch].v;
  const tail = .6 * ful + .4 * rw;
  const s = W.gut * gut + W.areas * areas + W.tail * tail;
  const stars = clamp(Math.round((0.5 + s * 4.5) * 2) / 2, .5, 5);
  return {gut, areas, tail, areasFromGut: !rated.length, stars};
}
const finalStars = () => clamp(score(S.f).stars + S.adjust, .5, 5);

/* ---------- Reseña (plantilla) ---------- */
function makeReview(f, seed, stars){
  const r = rng(hash(f.title.toLowerCase()) + seed * 7919);
  const pick = arr => arr[Math.floor(r() * arr.length)];
  const T = tidy(f.title) || 'Esta película';
  const T1 = f.year ? `${T} (${f.year})` : T;
  const paras = [];

  // 1. Impresión + emociones + si la terminó
  const open = [
    [`${T1} no me gustó para nada.`, `Con ${T1} no hubo caso: la sufrí.`, `${T1} me resultó insoportable.`],
    [`${T1} no me terminó de convencer.`, `Esperaba bastante más de ${T1}.`, `${T1} no me llegó.`],
    [`${T1} está bien, pero no mucho más.`, `${T1} se deja ver, aunque no me marcó.`, `Con ${T1} me quedé en el medio: ni fu ni fa.`],
    [`${T1} me gustó mucho.`, `La pasé muy bien con ${T1}.`, `${T1} me ganó.`],
    [`${T1} me voló la cabeza.`, `${T1} es de esas películas que te quedan dando vueltas.`, `Salí de ${T1} con ganas de contárselo a todo el mundo.`],
  ];
  let p1 = [pick(open[f.gut ?? 2])];
  if (f.feels.length) {
    const fs = f.feels.map((x, i) => i ? lc(x) : x);
    p1.push(joinY(fs) + '.');
  }
  if (f.done === 'partial') p1.push(pick(['La vi a medias, en partes o con distracciones, así que algo se me pudo escapar.', 'Aclaro que no la vi con toda la atención, así que tomen esto con pinzas.']));
  if (f.done === 'quit') p1.push(`La abandoné más o menos al ${f.quitAt}%, así que esta opinión es parcial.`);
  paras.push(p1.join(' '));

  // 2. Áreas
  const groups = [[], [], [], []];
  AREAS.forEach(a => { const v = f.areas[a.k]; if (typeof v.lv === 'number') groups[v.lv].push({...a, why: lc(v.why)}); });
  const p2 = [];
  const verb = {
    3: [pl => pl ? 'sobresalen' : 'sobresale', pl => pl ? 'son lo mejor' : 'es lo mejor'],
    2: [pl => pl ? 'están muy bien' : 'está muy bien', pl => pl ? 'funcionan muy bien' : 'funciona muy bien'],
    1: [pl => pl ? 'cumplen sin destacar' : 'cumple sin destacar', pl => pl ? 'están correctas, sin más' : 'está correcto, sin más'],
    0: [pl => pl ? 'fallan' : 'falla', pl => pl ? 'son lo más flojo' : 'es lo más flojo'],
  };
  const hasPositive = groups[3].length || groups[2].length;
  [3, 2, 1, 0].forEach(lv => {
    const g = groups[lv]; if (!g.length) return;
    const withWhy = g.filter(x => x.why), noWhy = g.filter(x => !x.why);
    // Si hay ambos tipos en el mismo nivel, uso un verbo distinto para cada uno y no se repite
    const flip = r() < .5;
    const vNo = verb[lv][flip ? 1 : 0], vWhy = noWhy.length ? verb[lv][flip ? 0 : 1] : pick(verb[lv]);
    let first = true;
    const pre = () => { const s = (lv === 0 && hasPositive && first) ? pick(['En cambio, ', 'Del otro lado, ']) : ''; first = false; return s; };
    if (noWhy.length) {
      const pl = noWhy.length > 1 || noWhy[0].pl;
      const subj = joinY(noWhy.map(x => x.art));
      const p = pre();
      p2.push((p ? p + subj : cap(subj)) + ' ' + vNo(pl) + '.');
    }
    withWhy.forEach(x => {
      const p = pre();
      p2.push((p ? p + x.art : cap(x.art)) + ' ' + vWhy(x.pl) + ': ' + x.why + '.');
    });
  });
  // Actores
  const actors = f.actors.filter(a => tidy(a.name));
  ['good', 'bad'].forEach(kind => {
    const g = actors.filter(a => a.verdict === kind); if (!g.length) return;
    const noWhy = g.filter(a => !tidy(a.why)), withWhy = g.filter(a => tidy(a.why));
    if (noWhy.length) {
      const names = joinY(noWhy.map(a => tidy(a.name)));
      const many = noWhy.length > 1;
      p2.push(kind === 'good'
        ? pick([`En el elenco ${many ? 'brillan' : 'brilla'} ${names}.`, `Muy bien ${names}.`])
        : pick([`${names} ${many ? 'desentonan' : 'desentona'}.`, `No me convenció lo de ${names}.`]));
    }
    withWhy.forEach(a => {
      p2.push(kind === 'good'
        ? pick([`${tidy(a.name)} se luce: ${lc(a.why)}.`, `Aparte, ${tidy(a.name)}: ${lc(a.why)}.`])
        : pick([`${tidy(a.name)} desentona: ${lc(a.why)}.`, `Lo de ${tidy(a.name)} no me cerró: ${lc(a.why)}.`]));
    });
  });
  if (p2.length) paras.push(p2.join(' '));

  // 3. Lo mejor / lo peor
  const p3 = [];
  if (tidy(f.best)) p3.push(pick([`Lo mejor: ${lc(f.best)}.`, `Me quedo con ${lc(f.best)}.`, `Lo que más disfruté fue ${lc(f.best)}.`]));
  if (tidy(f.worst)) p3.push(pick([`Lo peor: ${lc(f.worst)}.`, `Lo que no me cerró: ${lc(f.worst)}.`, `Le sobra ${lc(f.worst)}.`]));
  if (p3.length) paras.push(p3.join(' '));

  // 4. Cierre
  const p4 = [];
  const fulTxt = [
    ['No logra lo que se propone.', 'Siento que se queda muy lejos de lo que quería ser.'],
    ['Cumple a medias con lo que quiere ser.', 'Llega a la mitad de lo que promete.'],
    ['Logra lo que se propone.', 'Hace bien lo que quiere hacer.'],
    ['Va más allá de lo que se propone.', 'Supera lo que prometía.'],
  ];
  const rwTxt = [
    ['No la volvería a ver.', 'Una vez alcanzó.'],
    ['Quizás le dé otra oportunidad algún día.', 'Tal vez la revise más adelante.'],
    ['La volvería a ver.', 'Le daría otra vuelta con gusto.'],
    ['Ya tengo ganas de volver a verla.', 'La vería de nuevo hoy mismo.'],
  ];
  if (f.fulfilled != null) p4.push(pick(fulTxt[f.fulfilled]));
  if (f.rewatch != null) p4.push(pick(rwTxt[f.rewatch]));
  if (tidy(f.recommend)) p4.push(`Se la recomiendo a ${lc(f.recommend)}.`);
  p4.push(`Mi nota: ${fmt(stars)}/5.`);
  paras.push(p4.join(' '));
  return paras.join('\n\n');
}

/* ---------- Render ---------- */
function optBtn({act, key, val, label, sub, pressed, cls=''}){
  return `<button type="button" class="opt ${cls}" data-act="${act}" data-key="${key}" data-val="${esc(val)}" aria-pressed="${pressed}">${label}${sub ? `<small>${sub}</small>` : ''}</button>`;
}

function stepMovie(f){
  return `
  <div><h2>¿Qué viste?</h2><p class="lede">Empecemos por lo básico. El año es opcional, sirve para distinguir remakes.</p></div>
  <div class="fields">
    <label class="field">Título<input id="f-title" data-bind="title" value="${esc(f.title)}" placeholder="Ej. Relatos salvajes" autocomplete="off"></label>
    <label class="field">Año<input id="f-year" data-bind="year" value="${esc(f.year)}" inputmode="numeric" maxlength="4" placeholder="2014" autocomplete="off"></label>
  </div>
  <fieldset><legend>¿La terminaste de ver?</legend>
    <div class="opts">${DONE.map(d => optBtn({act:'set', key:'done', val:d.k, label:d.l, sub:d.s, pressed:f.done === d.k})).join('')}</div>
    ${f.done === 'quit' ? `<label class="field" for="f-quit"><span class="opt-note">¿Hasta dónde llegaste, más o menos?</span>
      <span class="range-row"><input id="f-quit" type="range" min="5" max="95" step="5" value="${f.quitAt}" data-bind="quitAt" data-num="1"><output id="quit-out">${f.quitAt}%</output></span></label>` : ''}
  </fieldset>`;
}

function stepGut(f){
  return `
  <div><h2>¿Cómo saliste?</h2><p class="lede">Tu primera impresión, sin pensarla mucho. Es lo que más pesa en la nota (55%).</p></div>
  <div class="gut" role="group" aria-label="Primera impresión">
    ${GUT.map((g, i) => `<button type="button" class="opt" data-act="set" data-key="gut" data-val="${i}" aria-pressed="${f.gut === i}"><b>${g.b}</b>${g.l}</button>`).join('')}
  </div>
  <fieldset><legend>¿Qué te provocó? <small>Opcional, marcá todas las que quieras</small></legend>
    <div class="opts">${FEELS.map(x => `<button type="button" class="opt chip" data-act="feel" data-val="${esc(x)}" aria-pressed="${f.feels.includes(x)}">${x}</button>`).join('')}</div>
  </fieldset>`;
}

function stepAreas(f){
  return `
  <div><h2>Por áreas</h2><p class="lede">Puntuá lo que te llamó la atención. Si algo no lo registraste, marcá “No me fijé” y no cuenta. El porqué es opcional, pero hace mejor la reseña.</p></div>
  ${AREAS.map(a => {
    const st = f.areas[a.k];
    const isNum = typeof st.lv === 'number';
    return `<fieldset class="area"><div class="area-head"><h3>${a.name}</h3><span>${a.hint}</span></div>
      <div class="opts">
        ${LEVELS.map((lv, i) => optBtn({act:'area', key:a.k, val:i, label:lv.l, pressed:st.lv === i})).join('')}
        ${optBtn({act:'area', key:a.k, val:'skip', label:'No me fijé', pressed:st.lv === 'skip', cls:'skip'})}
      </div>
      ${isNum ? `<input class="why" id="why-${a.k}" data-bind="areas.${a.k}.why" value="${esc(st.why)}" placeholder="${st.lv === 0 ? '¿Qué falló?' : st.lv === 1 ? '¿Qué le faltó?' : '¿Qué te gustó?'}" aria-label="Por qué, ${a.name}" autocomplete="off">` : ''}
      ${a.k === 'actuaciones' ? actorsBlock(f) : ''}
    </fieldset>`;
  }).join('')}`;
}

function actorsBlock(f){
  return `<div class="actors">
    <span class="opt-note"><b>¿De quién?</b> Nombrá a quien se destacó para bien o para mal.</span>
    ${f.actors.map((a, i) => `<div class="actor">
      <input id="actor-name-${i}" data-bind="actors.${i}.name" value="${esc(a.name)}" placeholder="Nombre" aria-label="Nombre del actor o actriz" autocomplete="off">
      <div class="opts">
        ${optBtn({act:'verdict', key:i, val:'good', label:'Brilló', pressed:a.verdict === 'good'})}
        ${optBtn({act:'verdict', key:i, val:'bad', label:'Desentonó', pressed:a.verdict === 'bad'})}
      </div>
      <input class="why-a" id="actor-why-${i}" data-bind="actors.${i}.why" value="${esc(a.why)}" placeholder="¿Por qué?" aria-label="Por qué" autocomplete="off">
      <button type="button" class="x" data-act="rm-actor" data-val="${i}" aria-label="Quitar">×</button>
    </div>`).join('')}
    <button type="button" class="link" data-act="add-actor">+ Agregar actor o actriz</button>
  </div>`;
}

function stepBestWorst(f){
  return `
  <div><h2>Lo mejor y lo peor</h2><p class="lede">Una escena, una idea, un detalle. Escribilo como se lo contarías a alguien. Las dos son opcionales.</p></div>
  <label class="field">Lo que más te gustó<textarea id="f-best" data-bind="best" placeholder="Ej. la escena del casamiento, que es puro caos">${esc(f.best)}</textarea></label>
  <label class="field">Lo que menos te gustó<textarea id="f-worst" data-bind="worst" placeholder="Ej. un final que se apura demasiado">${esc(f.worst)}</textarea></label>`;
}

function stepClose(f){
  return `
  <div><h2>Cierre</h2><p class="lede">Dos preguntas para ajustar la nota (15%) y una opcional para la reseña.</p></div>
  <fieldset><legend>¿Logra lo que quería ser? <small>Una comedia que hace reír cumple, aunque no sea arte.</small></legend>
    <div class="opts">${FUL.map((x, i) => optBtn({act:'set', key:'fulfilled', val:i, label:x.l, pressed:f.fulfilled === i})).join('')}</div>
  </fieldset>
  <fieldset><legend>¿La volverías a ver?</legend>
    <div class="opts">${RW.map((x, i) => optBtn({act:'set', key:'rewatch', val:i, label:x.l, pressed:f.rewatch === i})).join('')}</div>
  </fieldset>
  <label class="field">¿A quién se la recomendarías? <span class="opt-note">Opcional</span>
    <input id="f-rec" data-bind="recommend" value="${esc(f.recommend)}" placeholder="Ej. quien disfrute el humor negro" autocomplete="off"></label>`;
}

function stepResult(f){
  const sc = score(f), st = finalStars();
  if (!S.reviewEdited) S.review = makeReview(f, S.seed, st);
  const pct = v => Math.round(v * 100);
  return `
  <div class="ticket">
    <div class="main">
      <span class="label">${f.done === 'yes' ? 'Función completa' : f.done === 'partial' ? 'Vista a medias' : `Abandonada al ${f.quitAt}%`}${f.year ? ' · ' + esc(f.year) : ''}</span>
      <div class="title">${esc(tidy(f.title))}</div>
      ${starsHTML(st, 'lg')}
    </div>
    <div class="stub">
      <span class="label">Tu nota</span>
      <div class="big-num">${fmt(st)}</div>
      <span>${STAR_LABEL[st]}</span>
      <div class="adj">
        <button type="button" data-act="adj" data-val="-0.5" aria-label="Bajar media estrella" ${st <= .5 ? 'disabled' : ''}>−</button>
        <span class="label">${S.adjust ? (S.adjust > 0 ? '+' : '') + fmt(S.adjust) : 'ajustar'}</span>
        <button type="button" data-act="adj" data-val="0.5" aria-label="Subir media estrella" ${st >= 5 ? 'disabled' : ''}>+</button>
      </div>
    </div>
  </div>

  <section class="breakdown" aria-label="Cómo se calculó">
    <span class="label">Cómo se calculó · sugerido ${fmt(sc.stars)}</span>
    <div class="bar-row"><span>Primera impresión · 55%</span><div class="bar"><i style="width:${pct(sc.gut)}%"></i></div><span class="v">${pct(sc.gut)}</span></div>
    <div class="bar-row"><span>Áreas · 30%${sc.areasFromGut ? ' <small class="hint">(sin datos, usa la impresión)</small>' : ''}</span><div class="bar"><i style="width:${pct(sc.areas)}%"></i></div><span class="v">${pct(sc.areas)}</span></div>
    <div class="bar-row"><span>Cumplió y volverías · 15%</span><div class="bar"><i style="width:${pct(sc.tail)}%"></i></div><span class="v">${pct(sc.tail)}</span></div>
  </section>

  <label class="field review">Tu reseña <span class="opt-note">Editala como quieras antes de copiarla.</span>
    <textarea id="f-review" data-bind-review="1">${esc(S.review)}</textarea></label>

  <div class="actions">
    <button type="button" class="btn primary" data-act="copy">Copiar reseña</button>
    <button type="button" class="btn" data-act="reroll">Otra versión</button>
    <button type="button" class="btn" data-act="new">Calificar otra</button>
  </div>`;
}

const STEP_FNS = [stepMovie, stepGut, stepAreas, stepBestWorst, stepClose, stepResult];

function canNext(){
  const f = S.f;
  if (S.step === 0) return tidy(f.title) ? '' : 'Escribí el título para seguir.';
  if (S.step === 1) return f.gut != null ? '' : 'Elegí cómo saliste.';
  if (S.step === 4) return (f.fulfilled != null && f.rewatch != null) ? '' : 'Respondé las dos primeras.';
  return '';
}

function render(){
  const cur = S.step;
  $('#reel').innerHTML = `<span class="label">${cur < 5 ? `Rollo ${cur + 1} de 5 · ${STEPS[cur]}` : 'Resultado'}</span>
    <div class="strip" aria-hidden="true">${STEPS.map((_, i) => `<span class="${i < cur ? 'on' : i === cur ? 'cur' : ''}"></span>`).join('')}</div>`;
  $('#stage').innerHTML = STEP_FNS[cur](S.f);
  const block = canNext();
  $('#navbar').innerHTML = cur < 5
    ? `<button type="button" class="btn" data-act="back" ${cur === 0 ? 'disabled' : ''}>Atrás</button>
       <span class="hint" id="nav-hint">${block}</span>
       <button type="button" class="btn primary" data-act="next" id="next" ${block ? 'disabled' : ''}>${cur === 4 ? 'Ver resultado' : 'Siguiente'}</button>`
    : `<button type="button" class="btn" data-act="back">Volver a las preguntas</button>`;
}

function refreshNav(){
  const block = canNext(), n = $('#next'), h = $('#nav-hint');
  if (n) n.disabled = !!block;
  if (h) h.textContent = block;
}

/* ---------- Acciones ---------- */
async function copyText(txt, btn){
  const o = btn.textContent;
  try { await navigator.clipboard.writeText(txt); btn.textContent = 'Copiada'; }
  catch { const ta = $('#f-review'); ta.focus(); ta.select(); btn.textContent = 'Seleccionada: Ctrl+C'; }
  setTimeout(() => btn.textContent = o, 1800);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const {act, key, val} = el.dataset; const f = S.f;
  switch (act) {
    case 'set': f[key] = /^\d+$/.test(val) ? Number(val) : val; render(); break;
    case 'feel': { const i = f.feels.indexOf(val); i >= 0 ? f.feels.splice(i, 1) : f.feels.push(val); render(); break; }
    case 'area': { const a = f.areas[key]; const v = val === 'skip' ? 'skip' : Number(val); a.lv = a.lv === v ? null : v; render(); break; }
    case 'add-actor': f.actors.push({name:'', verdict:'good', why:''}); render(); { const n = $('#actor-name-' + (f.actors.length - 1)); n && n.focus(); } break;
    case 'rm-actor': f.actors.splice(Number(val), 1); render(); break;
    case 'verdict': f.actors[Number(key)].verdict = val; render(); break;
    case 'next': if (!canNext()) { S.step++; render(); window.scrollTo({top:0}); } break;
    case 'back': if (S.step > 0) { S.step--; render(); } break;
    case 'adj': S.adjust = clamp(S.adjust + Number(val), -2, 2); S.adjust = finalStars() - score(f).stars; render(); break;
    case 'reroll': S.seed++; S.reviewEdited = false; render(); break;
    case 'copy': copyText($('#f-review').value, el); break;
    case 'new': S.f = fresh(); S.step = 0; S.adjust = 0; S.seed = 0; S.reviewEdited = false; render(); window.scrollTo({top:0}); break;
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.bind) {
    setPath(S.f, t.dataset.bind, t.dataset.num ? Number(t.value) : t.value);
    if (t.id === 'f-quit') $('#quit-out').textContent = t.value + '%';
    refreshNav();
  } else if (t.dataset.bindReview) {
    S.review = t.value; S.reviewEdited = true;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && S.step < 5) {
    const n = $('#next'); if (n && !n.disabled) { ev.preventDefault(); n.click(); }
  }
});

render();
</script>
</body>
</html>
