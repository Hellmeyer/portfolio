<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Butaca</title>
<meta name="description" content="Calificá una película en cuatro pasos y obtené una nota de 0,5 a 5 estrellas con la reseña escrita.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23E8B33D' d='M16 2l4.1 8.9 9.7 1.1-7.2 6.6 2 9.6L16 23.3 7.4 28.2l2-9.6L2.2 12l9.7-1.1z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
/* Butaca usa la paleta, las tipografías y los componentes compartidos del sitio
   (../css/style.css: .btn, .eyebrow, .site-footer). Acá solo van los
   componentes propios de la herramienta: progreso, opciones, talón. */
:root{
  --bt-line:rgba(242,232,213,.16);    /* divisores y bordes decorativos */
  --bt-control:rgba(242,232,213,.4);  /* bordes de controles: ~3,3:1 contra --ink (WCAG 1.4.11) */
  color-scheme:dark;
}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  scroll-behavior:auto} /* el sitio usa smooth; acá cada paso vuelve arriba de golpe, como el contenido que acaba de cambiar */
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;color:var(--parchment)}
h2{font-size:clamp(1.8rem,4vw,2.3rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment-dim)}

/* Layout: columna angosta y centrada dentro del mismo .wrap que usan el nav y el footer */
.bt-main{padding:64px 0 88px}
.bt-col{max-width:720px;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;gap:28px}

/* Encabezado */
.bt-intro{display:flex;flex-direction:column;align-items:center;text-align:center}
/* Footer siempre pegado al piso; en la portada el bloque queda centrado en el espacio que sobra */
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bt-main{flex:1 0 auto;position:relative}
.bt-main > .wrap{position:relative;z-index:2}
/* Pared de pósters de la portada: columnas que suben y bajan sin parar, con un velo oscuro para que el texto se lea */
.bt-wall{--cols:6;position:absolute;inset:0;z-index:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:12px;padding:0 12px;overflow:hidden;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.bt-wall.on{opacity:1}
.wall-col{overflow:hidden}
.wall-track{display:flex;flex-direction:column;animation:wall-up var(--dur,70s) linear infinite;animation-direction:var(--dir,normal);animation-delay:var(--delay,0s);will-change:transform}
.wall-track img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;margin-bottom:12px;border-radius:2px;background:var(--ink-3)}
@keyframes wall-up{to{transform:translateY(-50%)}}
.bt-veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,var(--ink) 0,rgba(20,18,28,.84) 26%,rgba(20,18,28,.84) 56%,var(--ink) 100%)}
.bt-main:not(.is-intro) .bt-wall,.bt-main:not(.is-intro) .bt-veil{display:none}
@media (max-width:900px){.bt-wall{--cols:4}.wall-col:nth-child(n+5){display:none}}
@media (max-width:600px){.bt-wall{--cols:3}.wall-col:nth-child(n+4){display:none}}
@media (prefers-reduced-motion:reduce){.wall-track{animation:none}}
.bt-main.is-intro{display:flex;flex-direction:column;justify-content:center;padding-top:32px;padding-bottom:32px}
.site-footer{margin-top:auto}
.bt-intro h1{font-size:clamp(3.2rem,11vw,5.2rem);font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
.bt-intro p{color:var(--parchment);max-width:44ch;text-wrap:pretty;margin:0 auto 28px}

.bt-app{display:flex;flex-direction:column;gap:28px}
.bt-intro[hidden],.bt-app[hidden]{display:none}

/* Progreso: cinco tramos rectos; hecho en crema, actual en teal, pendiente apagado */
.reel{display:flex;flex-direction:column;gap:10px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.strip span{height:4px;background:rgba(242,232,213,.14)}
.strip span.on{background:var(--parchment-dim)}
.strip span.cur{background:var(--brass)}

/* Etapas */
.stage{display:flex;flex-direction:column;gap:24px}
.lede{color:var(--parchment-dim);max-width:60ch;margin-top:10px;text-wrap:pretty}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:600;color:var(--parchment);margin-bottom:10px;padding:0}
legend small,.opt-note{font-weight:400;color:var(--parchment-dim);font-size:.88rem}
.ac{position:relative;min-width:0}
.ac-list{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--ink-2);border:1px solid var(--bt-control);border-radius:2px;max-height:min(60vh,26rem);overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.ac-list[hidden]{display:none}
.ac-item{display:flex;gap:12px;align-items:center;padding:8px;min-height:64px;cursor:pointer;border-radius:2px}
.ac-item.on,.ac-item:hover{background:var(--ink-3)}
.ac-item img,.ac-ph{width:32px;height:48px;flex:none;border-radius:1px;object-fit:cover;background:var(--ink-3)}
.ac-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ac-txt b{font-weight:600;color:var(--parchment)}
.ac-txt small{color:var(--parchment-dim);font-size:.82rem}
.ac-note{padding:12px;color:var(--parchment-dim);font-size:.9rem}
.site-footer .tmdb-logo{display:inline-block;line-height:0}
.site-footer .tmdb-logo img{display:block;width:96px;height:auto}
.site-footer .tmdb{font-size:.78rem;margin-top:8px;margin-bottom:14px}
.fields{display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--parchment);min-width:0}
.field input,.field textarea{width:100%;background:var(--ink-2);border:1px solid var(--bt-control);border-radius:2px;padding:12px 14px;font-weight:400;color:var(--parchment)}
.field textarea{min-height:84px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--parchment-dim);opacity:.75}
/* Foco de las celdas de texto: mismo trazo que en reposo pero en teal y más grueso (2px, sin mover el layout); el coral queda solo para errores */
.field input:not([type=range]):focus,.field textarea:focus{outline:none;border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}

/* Opciones: la selección se invierte (crema), la acción principal queda en teal */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--bt-control);background:transparent;border-radius:2px;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--parchment);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:border-color .15s,background .15s,color .15s}
.opt small{font-weight:400;color:var(--parchment-dim);font-size:.82rem}
.opt:hover{border-color:var(--parchment)}
.opt[aria-pressed="true"]{background:var(--parchment);color:var(--ink);border-color:var(--parchment)}
.opt[aria-pressed="true"] small{color:inherit;opacity:.75}
.opt.skip{font-weight:400;color:var(--parchment-dim);border-style:solid}
.opt.skip[aria-pressed="true"]{background:var(--ink-3);color:var(--parchment);border-color:var(--parchment-dim)}
.chip{border-radius:999px;padding:7px 14px;font-weight:500}

.opts-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts-3 .opt{justify-content:center;text-align:center;padding:12px 8px}
.gut{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gut .opt{align-items:center;justify-content:center;text-align:center;padding:14px 8px;gap:6px}
.gut .em{font-size:1.7rem;line-height:1}

.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--brass)}
.range-row output{font-family:var(--mono);min-width:3.5em;text-align:right}

.area{border-top:1px solid var(--bt-line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.area:first-of-type{border-top:0;padding-top:0}
.area-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.area-head span{color:var(--parchment-dim);font-size:.9rem}

.navbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;border-top:1px solid var(--bt-line);padding-top:20px}
.nav-btns{display:flex;gap:10px}
.hint{color:var(--parchment-dim);font-size:.88rem}
.field-err{color:var(--frost);font-size:.92rem;font-weight:500;margin:-10px 0 0;scroll-margin-bottom:120px}
.field input[aria-invalid=true],.field input[aria-invalid=true]:focus{border-color:var(--frost);box-shadow:inset 0 0 0 1px var(--frost)}
.req{color:var(--frost);font-weight:700;margin-left:.15em}
/* Mobile: aviso arriba, botones juntos y anclados abajo, siempre visibles */
@media (max-width:600px){
  .navbar{position:sticky;bottom:0;z-index:5;flex-direction:column;align-items:stretch;gap:8px;
    border-top:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px))}
  /* Fondo translúcido con blur (el mismo que usa .topnav en el resto del sitio), a todo el ancho (el .wrap tiene 20px de margen a cada lado en mobile) */
  .navbar::before{content:"";position:absolute;inset:0 -20px;z-index:-1;pointer-events:none;
    background:rgba(20,22,31,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:var(--edge)}
  .nav-btns{gap:10px}
  /* Al enfocar el título en mobile: el campo sube al tope, se libera lugar (sin botonera) y la lista tiene alto para scrollear */
  .ac{scroll-margin-top:24px}
  .ac-list{max-height:42vh}
  body.ac-focus .navbar{display:none}
  body.ac-focus .bt-main{padding-bottom:75vh}
  .nav-btns .btn{flex:1;justify-content:center;text-align:center}
}

/* Botones: base compartida (.btn de style.css, contorno teal); acá el relleno de la acción principal y el estado deshabilitado */
.btn{background:transparent;cursor:pointer}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.primary:hover{background:#72c2d0;border-color:#72c2d0;color:var(--ink)} /* el mismo teal, 20% más claro */
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--brass)}
.btn.primary:disabled:hover{background:var(--brass);border-color:var(--brass);color:var(--ink)}

/* Talón de entrada */
.ticket{background:var(--ink-2);display:grid;grid-template-columns:minmax(0,1fr) 190px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(242,232,213,.22);
  -webkit-mask:radial-gradient(circle at calc(100% - 190px) 0,transparent 11px,#000 11.5px) top/100% 51% no-repeat,radial-gradient(circle at calc(100% - 190px) 100%,transparent 11px,#000 11.5px) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle at calc(100% - 190px) 0,transparent 11px,#000 11.5px) top/100% 51% no-repeat,radial-gradient(circle at calc(100% - 190px) 100%,transparent 11px,#000 11.5px) bottom/100% 51% no-repeat}
.ticket .main{padding:24px 26px;display:flex;flex-direction:row;align-items:center;gap:20px;min-width:0}
.ticket .main-txt{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
.ticket .poster{width:92px;height:auto;aspect-ratio:2/3;object-fit:cover;flex:none;border-radius:2px;background:var(--ink-3)}
@media (max-width:560px){.ticket .poster{width:72px}}
.ticket .stub{padding:24px 18px;border-left:2px solid var(--bt-control);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ticket .title{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,5vw,2.5rem);line-height:1.02;overflow-wrap:anywhere;color:var(--parchment)}
.big-num{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:.9;color:var(--epic)}
.adj{display:flex;align-items:center;gap:6px}
.adj button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bt-control);background:transparent;font-weight:600;font-size:1.1rem;cursor:pointer;color:var(--parchment)}
.adj button:hover:not(:disabled){border-color:var(--parchment)}
.adj button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:560px){.ticket{grid-template-columns:1fr;-webkit-mask:none;mask:none}.ticket .stub{border-left:0;border-top:2px solid var(--bt-control)}}

.stars{position:relative;display:inline-block;width:max-content;white-space:nowrap;line-height:1;font-size:1.6rem}
.stars .bg{color:rgba(242,232,213,.2)}
.stars .fg{position:absolute;left:0;top:0;bottom:0;overflow:hidden;color:var(--epic)}
.stars.lg{font-size:2rem}

.breakdown{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,14rem) 1fr 3rem;gap:12px;align-items:center;font-size:.92rem}
.bar{height:8px;background:rgba(242,232,213,.14)}
.bar i{display:block;height:100%;background:var(--brass)}
.bar-row .v{font-family:var(--mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--parchment-dim)}
@media (max-width:480px){.bar-row{grid-template-columns:1fr 3rem}.bar-row .bar{grid-column:1/-1;grid-row:2}}

.review textarea{min-height:260px;line-height:1.6;font-size:1rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>

<main class="bt-main is-intro" id="main">
  <div class="bt-wall" id="wall" aria-hidden="true"></div>
  <div class="bt-veil" aria-hidden="true"></div>
  <div class="wrap">
    <div class="bt-col">
      <section class="bt-intro" id="intro">
        <h1>Butaca</h1>
        <p>Reseñas de películas en cuatro pasos.</p>
        <button type="button" class="btn primary" id="start">Comenzar</button>
      </section>

      <div class="bt-app" id="app" hidden>
        <div class="reel" id="reel"></div>
        <section class="stage" id="stage" aria-live="polite"></section>
        <div class="navbar" id="navbar"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <a class="tmdb-logo" href="https://www.themoviedb.org/" target="_blank" rel="noopener" aria-label="The Movie Database (TMDB)"><img src="tmdb-logo.svg" alt="TMDB" width="96" height="12"></a>
    <p class="rights tmdb">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p class="rights">Tranqui, tu reseña no sale de tu navegador: solo el título se busca en TMDB. Sé vos.</p>
  </div>
</footer>

<script>
/* ---------- Datos fijos ---------- */
const AREAS = [
  {k:'guion', name:'Guion', hint:'Historia, diálogos, cómo cierra', art:'el guion', pl:false},
  {k:'actuaciones', name:'Actuaciones', hint:'Todo el elenco, no solo los protagonistas', art:'las actuaciones', pl:true},
  {k:'direccion', name:'Dirección y fotografía', hint:'Cómo está filmada, lo visual', art:'la dirección y la fotografía', parts:['la dirección','la fotografía'], pl:true},
  {k:'sonido', name:'Música y sonido', hint:'Banda sonora y diseño de sonido', art:'la música y el sonido', parts:['la música','el sonido'], pl:true},
  {k:'ritmo', name:'Ritmo y montaje', hint:'¿Fluye o se hizo larga?', art:'el ritmo', pl:false},
];
const LEVELS = [{l:'Floja',v:0},{l:'Correcta',v:.4},{l:'Buena',v:.75},{l:'Sobresaliente',v:1}];
const GUT = [
  {l:'La odié',v:0,e:'🤬'},{l:'No me gustó',v:.2,e:'🙁'},{l:'Ni fu ni fa',v:.5,e:'😐'},
  {l:'Me gustó',v:.75,e:'🙂'},{l:'Me gustó mucho',v:.88,e:'😄'},{l:'Me voló la cabeza',v:1,e:'🤯'}];
const FEELS = ['Me hizo reír','Me emocionó','Me tensionó','Me hizo pensar','Me dio miedo','Me dejó reflexionando','Me aburrió','Me incomodó','Me enojó','Me costó seguirla','No sé si la entendí','Nada wow'];
const FUL = [{l:'Se quedó corta',v:0},{l:'A medias',v:.4},{l:'Sí, cumple',v:.75},{l:'La superó',v:1}];
const RW = [{l:'Nunca',v:0},{l:'Quizás',v:.4},{l:'Sí',v:.75},{l:'Ya mismo',v:1}];
const DONE = [
  {k:'yes',l:'Sep'},
  {k:'partial',l:'A medias',s:'En partes o con distracciones'},
  {k:'quit',l:'Abandoné'}];
const W = {gut:.55, areas:.30, tail:.15};
const STAR_LABEL = {0.5:'Horrible',1:'Muy mala',1.5:'Mala',2:'Floja',2.5:'Regular',3:'Buena',3.5:'Muy buena',4:'Excelente',4.5:'Casi perfecta',5:'Obra maestra'};
const STEPS = ['La película','Primera impresión','Por áreas','Cierre'];

/* ---------- Estado ---------- */
function fresh(){
  const areas = {}; AREAS.forEach(a => areas[a.k] = {lv:null});
  return {title:'', year:'', poster:'', posterFor:'', done:'yes', quitAt:50, gut:null, feels:[], areas,
          fulfilled:null, rewatch:null};
}
const S = {showErr:false, step:0, f:fresh(), adjust:0, seed:0, review:''};

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => (v % 1 ? v.toFixed(1).replace('.', ',') : String(v));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const tidy = s => String(s || '').trim().replace(/[.\s]+$/, '');
const lc = s => { s = tidy(s); return s ? s[0].toLowerCase() + s.slice(1) : ''; };
const cap = s => { s = String(s || '').trim(); return s ? s[0].toUpperCase() + s.slice(1) : ''; };
function joinY(arr){
  if (arr.length <= 1) return arr[0] || '';
  const last = arr[arr.length - 1];
  const y = /^h?i(?![aeou])/i.test(last) ? 'e' : 'y';
  return arr.slice(0, -1).join(', ') + ' ' + y + ' ' + last;
}
function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function starsHTML(v, cls=''){
  return `<span class="stars ${cls}" role="img" aria-label="${fmt(v)} de 5 estrellas"><span class="bg" aria-hidden="true">★★★★★</span><span class="fg" aria-hidden="true" style="width:${v/5*100}%">★★★★★</span></span>`;
}
function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  ks.slice(0, -1).forEach(k => o = o[k]);
  o[ks[ks.length - 1]] = val;
}

/* ---------- Puntaje ---------- */
function score(f){
  const gut = f.gut == null ? 0 : GUT[f.gut].v;
  const rated = AREAS.map(a => f.areas[a.k].lv).filter(v => typeof v === 'number');
  const areas = rated.length ? rated.reduce((s, v) => s + LEVELS[v].v, 0) / rated.length : gut;
  const ful = f.fulfilled == null ? .5 : FUL[f.fulfilled].v;
  const rw = f.rewatch == null ? .5 : RW[f.rewatch].v;
  const tail = .6 * ful + .4 * rw;
  const s = W.gut * gut + W.areas * areas + W.tail * tail;
  const stars = clamp(Math.round((0.5 + s * 4.5) * 2) / 2, .5, 5);
  return {gut, areas, tail, areasFromGut: !rated.length, stars};
}
const finalStars = () => clamp(score(S.f).stars + S.adjust, .5, 5);

/* ---------- Reseña (plantilla) ---------- */
function makeReview(f, seed, stars){
  const r = rng(hash(f.title.toLowerCase()) + seed * 7919);
  const pick = arr => arr[Math.floor(r() * arr.length)];
  const T = tidy(f.title) || 'Esta película';
  const T1 = f.year ? `${T} (${f.year})` : T;
  const paras = [];

  // 1. Impresión + emociones + si la terminó
  const open = [
    [`${T1} no me gustó para nada.`, `${T1}: alto embole, la re sufrí.`, `${T1} me resultó infumable.`, `${T1} me emboló.`],
    [`${T1} no me terminó de convencer.`, `Esperaba bastante más de ${T1}.`, `${T1} no me llegó.`, `${T1} me emboló un poco.`],
    [`${T1} está bien, pero hasta ahí.`, `${T1} se deja ver, aunque no me marcó.`, `${T1} ni fu ni fa.`],
    [`${T1} me gustó.`, `${T1} está buena, me dejó conforme.`, `Disfruté ${T1}.`],
    [`${T1} me gustó mucho.`, `La pasé muy bien con ${T1}.`, `${T1} me copó.`],
    [`${T1} me voló la cabeza.`, `Gran peli ${T1} muy recomendable.`, `${T1} es de esas películas que te quedan dando vueltas.`],
  ];
  const gut = f.gut ?? 2;
  let p1 = [pick(open[gut])];
  if (f.feels.length) {
    const RE = ['Me emocionó', 'Me tensionó', 'Me aburrió', 'Me incomodó', 'Me enojó']; // verbos sueltos que admiten "re"
    const NEG = ['Me aburrió', 'Me incomodó', 'Me enojó', 'Me costó seguirla', 'No sé si la entendí', 'Nada wow'];
    const fs = f.feels.map((x, i) => {
      if (i === 0 && RE.includes(x) && r() < .5) x = x.replace('Me ', 'Me re ');
      if (x === 'Me hizo reír' && r() < .4) x = 'Me hizo reír mucho';
      if (x === 'Me dio miedo' && r() < .4) x = 'Me dio mucho miedo';
      if (x === 'Me dejó reflexionando' && r() < .5) x = 'Me dejó recalculando';
      return i ? lc(x) : x;
    });
    const feelTxt = fs.length === 1 ? fs[0] : fs.slice(0, -1).join(', ') + (r() < .5 ? ' y también ' : ' y ') + fs[fs.length - 1];
    // Si le gustó pero lo primero que sintió es negativo, se engancha con "pero"
    if (gut >= 3 && NEG.includes(f.feels[0])) p1[0] = p1[0].replace(/\.$/, '') + ', pero ' + lc(feelTxt) + '.';
    else p1.push(feelTxt + '.');
  }
  if (f.done === 'partial') p1.push(pick(['La vi medio por partes, así que quizás algo se me pase.', 'No la vi con toda la atención, quizás me olvidé de algo.']));
  if (f.done === 'quit') {
    const q = f.quitAt;
    const donde = q <= 30 ? 'al principio' : q >= 70 ? 'pasando la mitad de la peli' : 'a la mitad';
    const cierre = q <= 30 ? 'así que prácticamente no la vi.' : q >= 70 ? 'así que no sé si soy quien para bardearla.' : 'así que tómenlo como de quien viene.';
    p1.push(pick([
      `Me dormí ${donde}.`,
      `Me re dormí ${donde}.`,
      `La re quedé ${donde}.`,
      'No llegué al final, así que mucho no puedo hablar.',
      `La abandoné ${q <= 30 ? 'al principio' : q >= 70 ? 'antes del final' : 'a la mitad'}, ${cierre}`,
    ]));
  }
  paras.push(p1.join(' '));

  // 2. Áreas
  const groups = [[], [], [], []];
  AREAS.forEach(a => { const v = f.areas[a.k]; if (typeof v.lv === 'number') groups[v.lv].push(a); });
  const p2 = [];
  const adj = (base, pl, fem) => base + (fem ? 'a' : 'o') + (pl ? 's' : ''); // concordancia: choto/chota/chotos/chotas
  const verb = {
    3: [pl => pl ? 'están muy bien' : 'está muy bien', pl => pl ? 'son lo más' : 'es lo más'],
    2: [pl => pl ? 'garpan' : 'garpa', pl => pl ? 'van bien' : 'va bien', pl => pl ? 're van' : 're va'],
    1: [pl => pl ? 'zafan' : 'zafa'],
    0: [pl => pl ? 'no garpan' : 'no garpa', pl => pl ? 'no juegan' : 'no juega',
        (pl, fem) => (pl ? 'son bastante ' : 'es bastante ') + adj('chot', pl, fem)],
  };
  const hasPositive = groups[3].length || groups[2].length;
  [3, 2, 1, 0].forEach(lv => {
    const g = groups[lv]; if (!g.length) return;
    const has = k => g.some(x => x.k === k);
    // Nivel más alto: a veces se dice con frases propias ("está bien escrita y dirigida, tiene buen ritmo…") en vez de "son lo más"
    if (lv === 3 && (has('guion') || has('direccion') || has('ritmo')) && r() < .5) {
      const words = [has('guion') && 'escrita', has('direccion') && 'dirigida'].filter(Boolean);
      const film = [];
      if (words.length) film.push('está bien ' + joinY(words));
      if (has('ritmo')) film.push('tiene buen ritmo');
      const out = [cap(film.join(', ')) + '.'];
      if (has('direccion')) out.push('La fotografía me copó.');
      g.filter(x => x.k === 'sonido' || x.k === 'actuaciones').forEach(x => out.push(cap(x.art) + ' ' + (x.pl ? 'son lo más' : 'es lo más') + '.'));
      p2.push(out.join(' '));
      return;
    }
    // Al enumerar varias áreas, las que ya llevan una "y" adentro se separan para que quede una sola "y" al final
    const parts = g.flatMap(x => x.parts || [x.art]);
    const pl = parts.length > 1 || /^(las|los)\s/.test(parts[0]);
    const fem = parts.every(x => /^las?\s/.test(x));
    const subj = joinY(parts);
    const pre = (lv === 0 && hasPositive) ? pick(['En cambio, ', 'Por otra parte, ']) : '';
    p2.push((pre ? pre + subj : cap(subj)) + ' ' + pick(verb[lv])(pl, fem) + '.');
  });
  if (p2.length) paras.push(p2.join(' '));

  // 3. Cierre
  const p4 = [];
  const fulTxt = [
    ['Creo que no logra lo que se propone.', 'Siento que se queda muy lejos de lo que quería ser.'],
    ['Cumple a medias con lo que quiere ser.', 'Es bastante meh.'],
    ['Es lo que dice que es.', 'Hace bien lo que quiere hacer.'],
    ['Me sorprendió para bien.', 'Superó mis expectativas.'],
  ];
  const rwTxt = [
    ['No la volvería a ver.', 'No la vuelvo a ver ni a palos.'],
    ['Quizás le dé otra oportunidad algún día.', 'Tal vez la revise más adelante.'],
    ['En una de esas la volvería a ver.', 'La volvería a ver.'],
    ['Si alguien me dice de volver a verla, me sumo.', 'Fija que la vuelvo a ver algún día.'],
  ];
  let ft = f.fulfilled != null ? pick(fulTxt[f.fulfilled]) : '';
  let rt = f.rewatch != null ? pick(rwTxt[f.rewatch]) : '';
  // Si en general no le gustó pero el cierre es positivo, se engancha con "Aunque"
  if (ft && f.fulfilled >= 2 && stars < 3) ft = 'Aunque ' + ft[0].toLowerCase() + ft.slice(1);
  // Si no cumple pero la volvería a ver, se engancha con "pero"
  if (ft && rt && f.fulfilled <= 1 && f.rewatch >= 2) p4.push(ft.replace(/\.$/, '') + ', pero ' + rt[0].toLowerCase() + rt.slice(1));
  else { if (ft) p4.push(ft); if (rt) p4.push(rt); }
  p4.push(`Le doy ${fmt(stars)} de 5 estrellitas.`);
  paras.push(p4.join(' '));
  return paras.join('\n\n');
}

/* ---------- Render ---------- */
function optBtn({act, key, val, label, sub, pressed, cls=''}){
  return `<button type="button" class="opt ${cls}" data-act="${act}" data-key="${key}" data-val="${esc(val)}" aria-pressed="${pressed}">${label}${sub ? `<small>${sub}</small>` : ''}</button>`;
}

const REQ = '<span class="req" aria-hidden="true">*</span>';

function stepMovie(f){
  return `
  <div><h2>¿Qué viste?</h2><p class="lede">Empecemos por lo básico.</p></div>
  <div class="fields">
    <div class="ac">
      <label class="field"><span>Título ${REQ}</span><input id="f-title" data-bind="title" aria-required="true" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="title-list" value="${esc(f.title)}" placeholder="Ej. Relatos salvajes" autocomplete="off"></label>
      <ul class="ac-list" id="title-list" role="listbox" aria-label="Películas sugeridas" hidden></ul>
    </div>
  </div>
  <fieldset><legend>¿La terminaste de ver?</legend>
    <div class="opts opts-3">${DONE.map(d => optBtn({act:'set', key:'done', val:d.k, label:d.l, sub:d.s, pressed:f.done === d.k})).join('')}</div>
    ${f.done === 'quit' ? `<label class="field" for="f-quit"><span class="opt-note">¿Hasta dónde llegaste, más o menos?</span>

}

function stepGut(f){
  return `
  <div><h2>¿Qué sentiste? ${REQ}</h2><p class="lede">Tu primera impresión, sin pensarla mucho. Es lo que más pesa en la nota (55%).</p></div>

  </fieldset>`;

function stepAreas(f){
  return `
  <div><h2>Por áreas</h2><p class="lede">Puntuá lo que te llamó la atención. Si algo no lo registraste, marcá “No le di bola” y no cuenta.</p></div>

    const st = f.areas[a.k];
    const isNum = typeof st.lv === 'number';

      <div class="opts">

function stepClose(f){
  return `
  <div><h2>Cierre</h2><p class="lede">Dos preguntas para ajustar la nota (15%) y una opcional para la reseña.</p></div>
  <fieldset id="q-ful"><legend>¿Logra lo que quería ser? ${REQ} <small>Una comedia que hace reír cumple, aunque no sea arte.</small></legend>

function stepResult(f){
  const sc = score(f), st = finalStars();
  S.review = makeReview(f, S.seed, st);

  <section class="breakdown" aria-label="Cómo se calculó">

    <div class="bar-row"><span>Áreas · 30%${sc.areasFromGut ? ' <small class="hint">(sin datos, usa la impresión)</small>' : ''}</span><div class="bar"><i style="width:${pct(sc.areas)}%"></i></div><span class="v">${pct(sc.areas)}</span></div>
    <div class="bar-row"><span>Cumplió y volverías · 15%</span><div class="bar"><i style="width:${pct(sc.tail)}%"></i></div><span class="v">${pct(sc.tail)}</span></div>
  </section>

  <label class="field review">Tu reseña <span class="opt-note">Copiala o pedí otra versión.</span>

const STEP_FNS = [stepMovie, stepGut, stepAreas, stepClose, stepResult];

/* Campos obligatorios que faltan en el paso actual: dónde va el aviso y a dónde llevar al usuario */
function errors(){
  const f = S.f, e = [];
  if (S.step === 0 && !tidy(f.title)) e.push({after:'.fields', focus:'#f-title', msg:'Escribí el título para seguir.'});
  if (S.step === 1 && f.gut == null) e.push({after:'.gut', focus:'.gut .opt', msg:'Elegí qué sentiste para seguir.'});
  if (S.step === 3) {
    if (f.fulfilled == null) e.push({after:'#q-ful .opts', focus:'#q-ful .opt', msg:'Elegí si logra lo que quería ser.'});
    if (f.rewatch == null) e.push({after:'#q-rw .opts', focus:'#q-rw .opt', msg:'Elegí si la volverías a ver.'});
  }
  return e;
}
function canNext(){ return errors().length === 0; }

/* Los avisos solo aparecen después de apretar Siguiente sin poder, y desaparecen solos al corregir */
function paintErrors(){
  document.querySelectorAll('.field-err').forEach(n => n.remove());
  const t = $('#f-title'); if (t) t.removeAttribute('aria-invalid');
  if (!S.showErr) return;
  errors().forEach(er => {
    const p = document.createElement('p');
    p.className = 'field-err'; p.setAttribute('role', 'alert'); p.textContent = er.msg;
    $(er.after).insertAdjacentElement('afterend', p);
  });
  if (S.step === 0 && $('#f-title') && !tidy(S.f.title)) $('#f-title').setAttribute('aria-invalid', 'true');
}

function render(){
  const cur = S.step;
  AC.open = false; AC.items = []; AC.active = -1;
  document.body.classList.remove('ac-focus');
  $('#reel').innerHTML = `<span class="label">${cur < STEPS.length ? `Paso ${cur + 1} de ${STEPS.length} · ${STEPS[cur]}` : 'Resultado'}</span>
    <div class="strip" aria-hidden="true">${STEPS.map((_, i) => `<span class="${i < cur ? 'on' : i === cur ? 'cur' : ''}"></span>`).join('')}</div>`;
  $('#stage').innerHTML = STEP_FNS[cur](S.f);
  $('#navbar').innerHTML = cur < STEPS.length
    ? `<div class="nav-btns">
         <button type="button" class="btn" data-act="back">Atrás</button>
         <button type="button" class="btn primary" data-act="next" id="next">${cur === STEPS.length - 1 ? 'Ver resultado' : 'Siguiente'}</button>
       </div>`
    : `<div class="nav-btns"><button type="button" class="btn" data-act="back">Volver a las preguntas</button></div>`;
  paintErrors();
}

/* ---------- Autocompletar de títulos (TMDB) ---------- */
/* Las consultas a TMDB pasan por un Worker de Cloudflare (butaca-api) que guarda la clave del lado del servidor:
   en esta página no hay ninguna credencial. Rutas: /search?q=… y /trending?page=… */
const API = 'https://butaca-api.haldmeyer.workers.dev';
const AC = {timer:0, ctl:null, items:[], active:-1, open:false};

function api(route, params = {}, signal){
  return fetch(`${API}${route}?${new URLSearchParams(params)}`, {signal});
}

function acClose(){
  AC.open = false; AC.active = -1;
  const l = $('#title-list'), i = $('#f-title');
  if (l) { l.hidden = true; l.innerHTML = ''; }
  if (i) { i.setAttribute('aria-expanded', 'false'); i.removeAttribute('aria-activedescendant'); }
}
function acRender(note){
  const l = $('#title-list'), i = $('#f-title'); if (!l || !i) return;
  l.innerHTML = AC.items.length
    ? AC.items.map((m, k) => `<li role="option" id="ac-${k}" class="ac-item" data-i="${k}" aria-selected="false">
        ${m.poster ? `<img src="${esc(m.poster)}" alt="" width="32" height="48" loading="lazy">` : '<span class="ac-ph"></span>'}
        <span class="ac-txt"><b>${esc(m.title)}</b><small>${[esc(m.year), m.orig && m.orig !== m.title ? esc(m.orig) : ''].filter(Boolean).join(' · ')}</small></span></li>`).join('')
    : `<li class="ac-note">${note}</li>`;
  l.hidden = false; AC.open = true; AC.active = -1;
  i.setAttribute('aria-expanded', 'true');
}
function acMark(){
  document.querySelectorAll('.ac-item').forEach((el, k) => { el.classList.toggle('on', k === AC.active); el.setAttribute('aria-selected', k === AC.active); });
  const i = $('#f-title');
  if (AC.active >= 0) { i.setAttribute('aria-activedescendant', 'ac-' + AC.active); $('#ac-' + AC.active).scrollIntoView({block:'nearest'}); }
  else i.removeAttribute('aria-activedescendant');
}
function acSearch(q){
  clearTimeout(AC.timer); if (AC.ctl) AC.ctl.abort();
  q = q.trim();
  if (q.length < 2) { AC.items = []; acClose(); return; }
  AC.timer = setTimeout(async () => {
    AC.ctl = new AbortController();
    try {
      const r = await api('/search', {q}, AC.ctl.signal);
      if (!r.ok) throw new Error('tmdb ' + r.status);
      const d = await r.json();
      if (document.activeElement !== $('#f-title')) return;
      AC.items = (d.results || []).slice(0, 6).map(m => ({title: m.title || m.original_title, orig: m.original_title, year: (m.release_date || '').slice(0, 4), poster: m.poster_path ? 'https://image.tmdb.org/t/p/w92' + m.poster_path : '', path: m.poster_path || ''}));
      acRender('No la encuentro. Podés escribir el título igual.');
    } catch (e) { if (e.name !== 'AbortError') acClose(); }
  }, 300);
}
function acPick(k){
  const m = AC.items[k]; if (!m) return;
  S.f.title = m.title; $('#f-title').value = m.title;
  S.f.poster = m.path || ''; S.f.posterFor = tidy(m.title).toLowerCase(); // póster para el resultado; se descarta si después cambian el título
  S.f.year = m.year || '';
  acClose(); paintErrors();
  if (MOBILE.matches) $('#f-title').blur(); else $('#f-title').focus(); // en mobile se cierra el teclado para ver el resultado
}
function acKey(ev){
  if (ev.target.id !== 'f-title' || !AC.open) return false;
  const n = AC.items.length;
  if (ev.key === 'Escape') { acClose(); return true; }
  if (ev.key === 'Tab') { acClose(); return false; }
  if (!n) return false;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    AC.active = ev.key === 'ArrowDown' ? (AC.active + 1) % n : (AC.active - 1 + n) % n;
    acMark(); return true;
  }
  if (ev.key === 'Enter' && AC.active >= 0) { ev.preventDefault(); acPick(AC.active); return true; }
  return false;
}
const MOBILE = matchMedia('(max-width:600px)');
document.addEventListener('focusin', ev => {
  if (ev.target.id !== 'f-title' || !MOBILE.matches) return;
  document.body.classList.add('ac-focus');
  const go = () => { const a = $('.ac'); a && a.scrollIntoView({block:'start'}); };
  go(); setTimeout(go, 300); // otra vez cuando termina de abrirse el teclado
});
document.addEventListener('focusout', ev => { if (ev.target.id === 'f-title') document.body.classList.remove('ac-focus'); });
document.addEventListener('mousedown', ev => {
  const it = ev.target.closest('.ac-item');
  if (it) { ev.preventDefault(); acPick(Number(it.dataset.i)); }
  else if (!ev.target.closest('.ac')) acClose();
});

/* ---------- Pared de pósters (portada) ---------- */
/* 2 consultas (tendencias de la semana de TMDB, vía el Worker), guardadas 24 h en el navegador: cada visitante consulta como mucho una vez por día.
   Las imágenes salen del CDN de TMDB y no cuentan contra el límite de la API. Si todo falla, la portada queda con fondo liso. */
const WALL_KEY = 'butaca.wall.v1', WALL_TTL = 24 * 3600 * 1000;
async function wallPosters(){
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(WALL_KEY) || 'null'); } catch {}
  if (cached && cached.p && cached.p.length && Date.now() - cached.t < WALL_TTL) return cached.p;
  try {
    const pages = await Promise.all([1, 2].map(n => api('/trending', {page: n}).then(r => r.ok ? r.json() : Promise.reject())));
    const p = pages.flatMap(d => d.results || []).map(m => m.poster_path).filter(Boolean);
    if (p.length) { try { localStorage.setItem(WALL_KEY, JSON.stringify({t: Date.now(), p})); } catch {} return p; }
  } catch {}
  return (cached && cached.p) || [];
}
function buildWall(p){
  const wall = $('#wall'); if (!wall || !p.length) return;
  const COLS = 6, cols = Array.from({length: COLS}, () => []);
  p.forEach((x, i) => cols[i % COLS].push(x));
  wall.innerHTML = cols.map((c, i) => {
    const imgs = c.concat(c).map(x => `<img src="https://image.tmdb.org/t/p/w185${x}" alt="" loading="lazy" decoding="async">`).join('');
    return `<div class="wall-col"><div class="wall-track" style="--dur:${230 + (i % 3) * 50}s;--dir:${i % 2 ? 'reverse' : 'normal'};--delay:-${i * 37}s">${imgs}</div></div>`;
  }).join('');
  wall.classList.add('on');
}
wallPosters().then(buildWall);

/* ---------- Acciones ---------- */
async function copyText(txt, btn){
  const o = btn.textContent;
  try { await navigator.clipboard.writeText(txt); btn.textContent = 'Copiada'; }
  catch { const ta = $('#f-review'); ta.focus(); ta.select(); btn.textContent = 'Seleccionada: Ctrl+C'; }
  setTimeout(() => btn.textContent = o, 1800);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const {act, key, val} = el.dataset; const f = S.f;
  switch (act) {
    case 'set': f[key] = /^\d+$/.test(val) ? Number(val) : val; render(); break;
    case 'feel': { const i = f.feels.indexOf(val); i >= 0 ? f.feels.splice(i, 1) : f.feels.push(val); render(); break; }
    case 'area': { const a = f.areas[key]; const v = val === 'skip' ? 'skip' : Number(val); a.lv = a.lv === v ? null : v; render(); break; }
    case 'next':
      if (canNext()) { S.showErr = false; S.step++; render(); window.scrollTo({top:0}); }
      else {
        S.showErr = true; paintErrors();
        const first = errors()[0], tgt = $(first.focus);
        const note = $('.field-err'); (note || tgt).scrollIntoView({block:'center'});
        tgt && tgt.focus({preventScroll:true});
      }
      break;
    case 'back': S.showErr = false; if (S.step > 0) { S.step--; render(); } else showIntro(); break;
    case 'adj': S.adjust = clamp(S.adjust + Number(val), -2, 2); S.adjust = finalStars() - score(f).stars; render(); break;
    case 'reroll': S.seed++; render(); break;
    case 'copy': copyText($('#f-review').value, el); break;
    case 'new': S.f = fresh(); S.step = 0; S.adjust = 0; S.seed = 0; S.showErr = false; render(); window.scrollTo({top:0}); break;
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.bind) {
    setPath(S.f, t.dataset.bind, t.dataset.num ? Number(t.value) : t.value);
    if (t.id === 'f-quit') $('#quit-out').textContent = t.value + '%';
    paintErrors();
    if (t.id === 'f-title') {
      if (S.f.posterFor && tidy(t.value).toLowerCase() !== S.f.posterFor) { S.f.poster = ''; S.f.year = ''; S.f.posterFor = ''; }
      acSearch(t.value);
    }
  }
});
document.addEventListener('keydown', ev => {
  if (acKey(ev)) return;
  if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && S.step < STEPS.length) {
    const n = $('#next'); if (n) { ev.preventDefault(); n.click(); }
  }
});

render();

/* ---------- Portada ---------- */
function showApp(){
  $('#main').classList.remove('is-intro');
  $('#intro').hidden = true;
  $('#app').hidden = false;
  window.scrollTo({top:0});
}
function showIntro(){
  $('#main').classList.add('is-intro');
  $('#app').hidden = true;
  $('#intro').hidden = false;
  window.scrollTo({top:0});
  $('#start').focus({preventScroll:true});
}
$('#start').addEventListener('click', showApp);
</script>
