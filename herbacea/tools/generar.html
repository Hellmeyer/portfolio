<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Herbácea · generar imágenes</title>
  <base href="../">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&display=swap" rel="stylesheet">
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #eef0e8; color: #14211a; }
    main { padding: 2rem; }
    button { font: inherit; padding: 0.6rem 1rem; margin-right: 0.5rem; border-radius: 999px; border: 1px solid #14211a; background: #14211a; color: #eef0e8; cursor: pointer; }
    #log { white-space: pre-wrap; font-size: 13px; margin-top: 1rem; }
    #vista { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
    #vista img { height: 140px; background: #dfe3d6; border-radius: 6px; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <main>
  <h1>Fotos del catálogo</h1>
  <p>Renderiza una sola vez los elementos naturales (assets/fondos) y las fotos del catálogo (assets/productos).
     Corré <code>node tools/recibir.js</code> y abrí esta página desde <code>http://localhost:5180/tools/generar.html</code>.</p>
  <button id="fondos">Generar fondos</button>
  <button id="fichas">Generar fotos del catálogo</button>
  <div id="log"></div>
  <div id="vista"></div>
  </main>
  <script type="module">
    import { montarBarra } from './tools/herramientas.js';
    montarBarra('catalogo');
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { NOMBRES, crearAccesorio } from './tools/accesorios.js';
    import { Estudio } from './js/bottle3d.js';
    import { PRODUCTOS, resolver } from './js/products.js';
    import { FONDOS } from './js/fondos.js';
    import { crearFotografo } from './tools/fichas.js';

    const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
    const vista = (url) => { const i = new Image(); i.src = url; document.getElementById('vista').append(i); };
    async function guardar(en, nombre, blob) {
      const r = await fetch(`guardar?en=${en}&n=${nombre}`, { method: 'POST', body: blob });
      log(await r.text());
    }

    // ── Fondos: cada elemento solo, con la misma inclinación de cámara que el sitio ──
    async function generarFondos() {
      const W = 1600;
      const canvas = document.createElement('canvas');
      const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      r.setPixelRatio(1);
      r.setSize(W, W, false);
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.NeutralToneMapping;
      r.toneMappingExposure = 1.05;
      const escena = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(r);
      escena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      escena.environmentIntensity = 0.8;
      const sol = new THREE.DirectionalLight(0xfff0d6, 1.2);
      sol.position.set(6, 10, 7);
      escena.add(sol, new THREE.AmbientLight(0xffffff, 0.15));
      const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 500);
      const manifiesto = {};

      for (const nombre of NOMBRES) {
        if (FONDOS[nombre]?.foto) { manifiesto[nombre] = FONDOS[nombre]; log('se conserva la foto: ' + nombre); continue; }
        const obj = crearAccesorio(nombre, 11);
        escena.add(obj);
        const caja = new THREE.Box3().setFromObject(obj);
        const esfera = caja.getBoundingSphere(new THREE.Sphere());
        const d = esfera.radius / Math.sin(THREE.MathUtils.degToRad(12)) * 1.02;
        const dir = new THREE.Vector3(0, Math.sin(0.14), Math.cos(0.14)).normalize();
        cam.position.copy(esfera.center).addScaledVector(dir, d);
        cam.lookAt(esfera.center);
        cam.updateMatrixWorld();
        r.render(escena, cam);

        // recorte al contenido
        const tmp = document.createElement('canvas');
        tmp.width = W; tmp.height = W;
        const ctx = tmp.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(canvas, 0, 0);
        const px = ctx.getImageData(0, 0, W, W).data;
        let x0 = W, y0 = W, x1 = 0, y1 = 0;
        for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
          if (px[(y * W + x) * 4 + 3] > 6) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        }
        x0 = Math.max(0, x0 - 4); y0 = Math.max(0, y0 - 4); x1 = Math.min(W - 1, x1 + 4); y1 = Math.min(W - 1, y1 + 4);
        const proy = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam); return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * W }; };
        const o = proy(0, 0, 0), u = proy(0, 1, 0);
        const max = 1100;
        const k = Math.min(1, max / Math.max(x1 - x0, y1 - y0));
        const out = document.createElement('canvas');
        out.width = Math.round((x1 - x0) * k); out.height = Math.round((y1 - y0) * k);
        out.getContext('2d').drawImage(tmp, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
        const archivo = nombre.replace(':', '-') + '.webp';
        const blob = await new Promise((ok) => out.toBlob(ok, 'image/webp', 0.86));
        await guardar('fondos', archivo, blob);
        vista(out.toDataURL('image/webp', 0.7));
        manifiesto[nombre] = {
          w: out.width, h: out.height,
          ax: +((o.x - x0) * k).toFixed(1), ay: +((o.y - y0) * k).toFixed(1),
          pxcm: +(Math.abs(o.y - u.y) * k).toFixed(3),
        };
        escena.remove(obj);
      }
      const js = '// Generado por tools/generar.html — no editar a mano.\n// w/h: tamaño de la imagen; ax/ay: punto del piso en la imagen; pxcm: píxeles por cm.\nexport const FONDOS = ' + JSON.stringify(manifiesto, null, 2) + ';\n';
      await guardar('datos', 'fondos.js', new Blob([js]));
      r.dispose();
      log('Fondos listos.');
    }

    // ── Fotos del catálogo: frasco 3D + la composición de cada producto ──
    async function generarFichas() {
      const f = crearFotografo();
      for (const p of PRODUCTOS) {
        const blob = await f.foto(p);
        await guardar('productos', p.id + '.webp', blob);
        vista(URL.createObjectURL(blob));
      }
      f.destruir();
      log('Fotos del catálogo listas.');
    }

    document.getElementById('fondos').onclick = generarFondos;
    document.getElementById('fichas').onclick = generarFichas;
    window.generarFondos = generarFondos;
    window.generarFichas = generarFichas;
  </script>
</body>
</html>
