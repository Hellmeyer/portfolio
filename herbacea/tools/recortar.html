<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herbácea · fotos de elementos</title>
  <base href="../">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root { --panel: #f7f8f3; --borde: #d3d8cb; }
    body { margin: 0; background: #e4e7de; color: var(--tinta); font: 14px/1.45 var(--sans); }
    .rc { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; height: calc(100svh - var(--hub, 0px)); }
    aside, .opciones { background: var(--panel); overflow-y: auto; padding: 1rem; }
    aside { border-right: 1px solid var(--borde); }
    .opciones { border-left: 1px solid var(--borde); display: grid; gap: 0.9rem; align-content: start; }
    h1 { font: 400 1.2rem var(--serif); margin: 0 0 0.4rem; }
    h2 { font: 600 12.5px var(--sans); color: var(--piedra); margin: 0 0 0.5rem; }
    .ayuda { color: var(--piedra); font-size: 12.5px; margin: 0 0 0.9rem; }
    .ayuda code { background: #fff; padding: 0 0.3rem; border-radius: 4px; }
    .fotos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .fotos button { width: 100%; padding: 4px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; cursor: pointer; display: grid; gap: 3px; }
    .fotos button[aria-current=true] { border-color: var(--tinta); outline: 2px solid var(--tinta); }
    .fotos img { width: 100%; aspect-ratio: 1; object-fit: contain; background: repeating-conic-gradient(#e8e8e8 0 25%, #fff 0 50%) 0 0 / 14px 14px; border-radius: 5px; }
    .fotos small { font-size: 10.5px; color: var(--piedra); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comparar { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1.25rem; align-content: start; overflow: auto; }
    .comparar figure { margin: 0; display: grid; gap: 0.4rem; }
    .comparar figcaption { font-size: 12.5px; color: var(--piedra); }
    .lienzo { border-radius: 10px; min-height: 280px; display: grid; place-items: center; padding: 1rem; }
    .lienzo.claro { background: repeating-conic-gradient(#e8e8e8 0 25%, #fff 0 50%) 0 0 / 18px 18px; }
    .lienzo.oscuro { background: #2a3b1f; }
    .lienzo img, .lienzo canvas { max-width: 100%; max-height: 60svh; }
    .vacio { color: var(--piedra); }
    label.campo { display: grid; gap: 4px; font-size: 12.5px; color: var(--piedra); }
    label.campo input, label.campo select { font: 14px/1.4 var(--sans); color: var(--tinta); padding: 0.5rem 0.6rem; border: 1px solid var(--borde); border-radius: 8px; background: #fff; }
    .check { display: flex; gap: 0.5rem; align-items: center; font-size: 13px; }
    .boton-chico { font: 500 13px/1 var(--sans); padding: 0.7rem 1rem; border-radius: 999px; border: 1px solid var(--tinta); background: transparent; color: var(--tinta); cursor: pointer; }
    .boton-chico.principal { background: var(--tinta); color: #eef0e8; }
    .boton-chico:disabled { opacity: 0.45; cursor: default; }
    .estado { font-size: 12.5px; color: var(--piedra); }
    .estado.ok { color: #2e6b3a; }
    .estado.error { color: #9e2b27; }
  </style>
</head>
<body>
  <div class="rc">
    <aside>
      <h1>Fotos de elementos</h1>
      <p class="ayuda">Subí tus fotos a <code>assets\fondos\Generadas</code> y aparecen acá. Sirven fotos con fondo transparente o con fondo blanco/gris liso.</p>
      <button class="boton-chico" id="refrescar" type="button" style="width:100%;margin-bottom:0.8rem">Buscar fotos nuevas</button>
      <ul class="fotos" id="fotos"></ul>
    </aside>

    <section class="comparar">
      <figure><figcaption>Original</figcaption><div class="lienzo claro" id="original"><p class="vacio">Elegí una foto de la lista.</p></div></figure>
      <figure><figcaption>Resultado (sobre el verde de la marca)</figcaption><div class="lienzo oscuro" id="resultado"></div></figure>
    </section>

    <section class="opciones">
      <div>
        <h2>Usar como</h2>
        <label class="campo">Elemento<select id="destino"></select></label>
        <label class="campo" id="nuevoNombre" hidden style="margin-top:0.5rem">Nombre del elemento nuevo<input id="nombreNuevo" placeholder="por ejemplo: flores:rosa o ramita:salvia"></label>
      </div>
      <div>
        <h2>Ajustes</h2>
        <label class="campo">Tamaño real aproximado (cm)<input id="cm" type="number" min="1" max="40" step="0.5" value="5"></label>
        <label class="campo" style="margin-top:0.5rem">Medir el tamaño por<select id="por"><option value="ancho">Ancho</option><option value="alto">Alto (plantas altas)</option></select></label>
        <label class="campo" style="margin-top:0.5rem">Rotar (grados)<input id="rot" type="number" min="-180" max="180" step="5" value="0"></label>
        <div class="check" style="margin-top:0.6rem"><input type="checkbox" id="espejo"><label for="espejo">Espejar horizontalmente</label></div>
        <div class="check" style="margin-top:0.4rem"><input type="checkbox" id="tallo"><label for="tallo">Apoyar desde el tallo (plantas)</label></div>
        <div class="check" style="margin-top:0.4rem"><input type="checkbox" id="petalos"><label for="petalos">Pétalos muy claros (fondo blanco)</label></div>
      </div>
      <div>
        <button class="boton-chico principal" id="guardar" type="button" disabled style="width:100%">Guardar elemento</button>
        <p class="estado" id="estado" style="margin-top:0.6rem"></p>
        <p class="ayuda" style="margin-top:0.6rem">Al guardar se reemplaza el elemento en el sitio. Después regenerá las fotos del catálogo para verlo también en las fichas.</p>
      </div>
    </section>
  </div>

  <script type="module">
    import { montarBarra } from './tools/herramientas.js';
    montarBarra('fondos');

    const $ = (s) => document.querySelector(s);
    let actual = null, resultado = null, fondos = {};

    const etiqueta = (n) => n.replace(':', ' · ').replace(/^./, (c) => c.toUpperCase());
    async function cargarFondos() {
      fondos = (await import('./js/fondos.js?t=' + Date.now())).FONDOS;
      $('#destino').innerHTML = Object.keys(fondos).map((n) => `<option value="${n}">${etiqueta(n)}</option>`).join('') + '<option value="__nuevo">Elemento nuevo…</option>';
    }
    async function listar() {
      const fotos = await fetch('listar').then((r) => r.json()).catch(() => []);
      $('#fotos').innerHTML = fotos.length
        ? fotos.map((f) => `<li><button type="button" data-n="${encodeURIComponent(f.nombre)}" aria-current="${actual === f.nombre}"><img src="assets/fondos/Generadas/${encodeURIComponent(f.nombre)}" alt="" loading="lazy"><small>${f.nombre}</small></button></li>`).join('')
        : '<li class="vacio" style="grid-column:1/-1">No hay fotos en la carpeta todavía.</li>';
    }
    $('#refrescar').addEventListener('click', listar);
    $('#fotos').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      actual = decodeURIComponent(b.dataset.n);
      document.querySelectorAll('#fotos button').forEach((x) => x.setAttribute('aria-current', String(x === b)));
      $('#original').innerHTML = `<img src="assets/fondos/Generadas/${encodeURIComponent(actual)}" alt="">`;
      procesar();
    });
    $('#destino').addEventListener('change', () => {
      $('#nuevoNombre').hidden = $('#destino').value !== '__nuevo';
      const d = fondos[$('#destino').value];
      const planta = ['palmera', 'monstera', 'lavanda', 'pasto'].includes($('#destino').value.split(':')[0]);
      $('#tallo').checked = planta;
      $('#por').value = planta ? 'alto' : 'ancho';
      if (d) $('#cm').value = +(((planta ? d.h : d.w) / d.pxcm).toFixed(1));
      procesar();
    });
    for (const id of ['rot', 'espejo', 'tallo', 'petalos']) $('#' + id).addEventListener('change', procesar);

    // ── recorte ──
    function cargarImagen(src) { return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; }); }

    /** Quita el fondo: velo semitransparente en PNG, o fondo claro conectado a los bordes en fotos. */
    function quitarFondo(c, petalos) {
      const W = c.width, H = c.height, ctx = c.getContext('2d', { willReadFrequently: true });
      const id = ctx.getImageData(0, 0, W, H), d = id.data, N = W * H;
      const esquinas = [d[3], d[(W - 1) * 4 + 3], d[(H - 1) * W * 4 + 3], d[(N - 1) * 4 + 3]];
      if (Math.min(...esquinas) < 250) {
        // ya es transparente: limpiar el velo
        const velo = Math.max(...esquinas), umbral = velo > 8 ? velo * 1.7 : 6;
        for (let i = 3; i < d.length; i += 4) { const a = d[i]; d[i] = a <= umbral ? 0 : Math.min(255, Math.round((a - umbral) * 255 / (255 - umbral))); }
      } else {
        // fondo claro: inundar desde los bordes; la sombra queda como transparencia suave
        const L = new Float32Array(N), C = new Float32Array(N);
        for (let i = 0; i < N; i++) { const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2]; L[i] = 0.299 * r + 0.587 * g + 0.114 * b; C[i] = Math.max(r, g, b) - Math.min(r, g, b); }
        const neutro = (i) => !petalos || (d[i * 4] - d[i * 4 + 1] < 11 && d[i * 4] - d[i * 4 + 2] < 11);
        const fondo = new Uint8Array(N), pila = [];
        for (let x = 0; x < W; x++) pila.push(x, (H - 1) * W + x);
        for (let y = 0; y < H; y++) pila.push(y * W, y * W + W - 1);
        while (pila.length) {
          const i = pila.pop();
          if (fondo[i] || !(C[i] < 20 && L[i] > 140 && neutro(i))) continue;
          fondo[i] = 1;
          const x = i % W;
          if (x > 0) pila.push(i - 1);
          if (x < W - 1) pila.push(i + 1);
          if (i >= W) pila.push(i - W);
          if (i < N - W) pila.push(i + W);
        }
        let ref = 0;
        for (let i = 0; i < N; i++) if (fondo[i] && L[i] > ref) ref = L[i];
        for (let i = 0; i < N; i++) {
          if (!fondo[i]) continue;
          const osc = Math.max(0, (ref - L[i]) / ref);
          d[i * 4] = 20; d[i * 4 + 1] = 28; d[i * 4 + 2] = 22;
          d[i * 4 + 3] = Math.round(Math.min(0.45, Math.max(0, (osc - 0.03) * 2.6)) * 255);
        }
      }
      ctx.putImageData(id, 0, 0);
    }

    async function procesar() {
      if (!actual) return;
      const img = await cargarImagen('assets/fondos/Generadas/' + encodeURIComponent(actual) + '?' + Date.now());
      const r = (+$('#rot').value || 0) * Math.PI / 180, cs = Math.abs(Math.cos(r)), sn = Math.abs(Math.sin(r));
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const esc = Math.min(1, 1600 / Math.max(iw, ih)); // trabajar a un tamaño razonable
      const w0 = Math.round(iw * esc), h0 = Math.round(ih * esc);
      const base = document.createElement('canvas'); base.width = w0; base.height = h0;
      base.getContext('2d').drawImage(img, 0, 0, w0, h0);
      quitarFondo(base, $('#petalos').checked);
      const W = Math.ceil(w0 * cs + h0 * sn), H = Math.ceil(w0 * sn + h0 * cs);
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.translate(W / 2, H / 2); x.rotate(r);
      if ($('#espejo').checked) x.scale(-1, 1);
      x.drawImage(base, -w0 / 2, -h0 / 2);
      x.setTransform(1, 0, 0, 1, 0, 0);
      const d = x.getImageData(0, 0, W, H).data;
      let x0 = W, y0 = H, x1 = 0, y1 = 0;
      for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) if (d[(y * W + xx) * 4 + 3] > 20) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0) { $('#estado').textContent = 'No quedó nada visible: probá destildar "Pétalos muy claros".'; return; }
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      let ax = w / 2;
      if ($('#tallo').checked) {
        let s = 0, n = 0;
        for (let y = y1 - Math.round(h * 0.04); y <= y1; y++) for (let xx = x0; xx <= x1; xx++) if (d[(y * W + xx) * 4 + 3] > 60) { s += xx - x0; n++; }
        if (n) ax = s / n;
      }
      const k = Math.min(1, 1000 / Math.max(w, h));
      const out = document.createElement('canvas'); out.width = Math.round(w * k); out.height = Math.round(h * k);
      out.getContext('2d').drawImage(c, x0, y0, w, h, 0, 0, out.width, out.height);
      resultado = { canvas: out, ax: ax * k };
      $('#resultado').replaceChildren(out);
      $('#guardar').disabled = false;
      $('#estado').className = 'estado';
      $('#estado').textContent = '';
    }

    $('#guardar').addEventListener('click', async () => {
      if (!resultado) return;
      let nombre = $('#destino').value;
      if (nombre === '__nuevo') {
        nombre = $('#nombreNuevo').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9:]+/g, '-').replace(/^-|-$/g, '');
        if (!nombre) { $('#estado').textContent = 'Escribí un nombre para el elemento nuevo.'; return; }
      }
      const cm = +$('#cm').value;
      if (!(cm > 0)) { $('#estado').textContent = 'Indicá un tamaño en cm.'; return; }
      $('#guardar').disabled = true;
      $('#estado').className = 'estado';
      $('#estado').textContent = 'Guardando…';
      try {
        const o = resultado.canvas;
        const blob = await new Promise((ok) => o.toBlob(ok, 'image/webp', 0.88));
        const r1 = await fetch(`guardar?en=fondos&n=${nombre.replace(':', '-')}.webp`, { method: 'POST', body: blob });
        if (!r1.ok) throw new Error(await r1.text());
        const actuales = { ...(await import('./js/fondos.js?t=' + Date.now())).FONDOS };
        actuales[nombre] = {
          w: o.width, h: o.height, ax: +resultado.ax.toFixed(1), ay: o.height,
          pxcm: +(((($('#por').value === 'alto') ? o.height : o.width) / cm).toFixed(3)), foto: true,
        };
        const js = '// Generado por tools/generar.html y tools/recortar.html — no editar a mano.\n// w/h: tamaño de la imagen; ax/ay: punto del piso en la imagen; pxcm: píxeles por cm; foto: imagen real (no se regenera).\nexport const FONDOS = ' + JSON.stringify(actuales, null, 2) + ';\n';
        const r2 = await fetch('guardar?en=datos&n=fondos.js', { method: 'POST', body: new Blob([js]) });
        if (!r2.ok) throw new Error(await r2.text());
        $('#estado').className = 'estado ok';
        $('#estado').textContent = `Guardado como "${etiqueta(nombre)}". Ya está disponible en el editor de composiciones.`;
        await cargarFondos();
        $('#destino').value = nombre;
      } catch (err) {
        $('#estado').className = 'estado error';
        $('#estado').textContent = 'No se pudo guardar: ' + err.message;
      } finally {
        $('#guardar').disabled = false;
      }
    });

    await cargarFondos();
    $('#destino').dispatchEvent(new Event('change'));
    await listar();
  </script>
</body>
</html>
